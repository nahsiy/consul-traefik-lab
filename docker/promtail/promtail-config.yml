# ============================================
# PROMTAIL - Configuration
# ============================================
# Promtail collecte les logs et les envoie à Loki
# C'est l'équivalent de Prometheus qui "scrape", mais pour les logs

server:
  http_listen_port: 9080
  grpc_listen_port: 0

# Où trouver la config des positions (pour ne pas re-lire les mêmes logs)
positions:
  filename: /tmp/positions.yaml

# Où envoyer les logs
clients:
  - url: http://loki:3100/loki/api/v1/push

# ============================================
# SCRAPE CONFIGS - Quels logs collecter
# ============================================
scrape_configs:
  # ------------------------------------------
  # Logs des conteneurs Docker
  # ------------------------------------------
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    
    relabel_configs:
      # Utilise le nom du conteneur comme label "container"
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      
      # Ajoute le nom du service compose comme label
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
      
      # Ajoute le nom du projet compose
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: 'project'
      
      # Filtre : ne garde que les conteneurs du projet "docker"
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        regex: 'docker'
        action: keep

# ============================================
# 💡 COMMENT ÇA MARCHE
# ============================================
# 1. Promtail se connecte au socket Docker
# 2. Il découvre automatiquement tous les conteneurs
# 3. Il lit leurs logs en temps réel
# 4. Il ajoute des labels (container, service, project)
# 5. Il envoie tout à Loki
#
# Dans Grafana, tu pourras filtrer par :
# - {service="nginx"}     → logs de Nginx
# - {service="traefik"}   → logs de Traefik
# - {container=~".*"}     → tous les conteneurs
