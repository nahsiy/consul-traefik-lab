# Docker Compose file
# Documentation: https://docs.docker.com/compose/compose-file/

services:
  # TODO: Nommez votre premier service (ex: web, nginx, frontend...)
  nginx:
    # TODO: Quelle image Docker utiliser ? (ex: nginx:latest, nginx:alpine...)
    image: nginx:alpine
    
    # TODO: Mapper le port 80 du container vers un port de votre Mac
    # Format: "PORT_LOCAL:PORT_CONTAINER"
    ports:
      - "8080:80"
    
    # TODO: Monter un volume pour servir votre propre page HTML
    # Format: "./chemin/local:chemin/dans/container"
    # Indice: nginx sert les fichiers depuis /usr/share/nginx/html
    volumes:
      - ./html:/usr/share/nginx/html:ro
    
    # TODO: Attacher ce service à un réseau custom
    networks:
      - lab-network

  # Service Consul - Service Discovery & Configuration
  consul:
    image: hashicorp/consul:latest

    # Port 8500 = API HTTP + Interface Web
    ports:
      - "8500:8500"

    # Mode développement : un seul nœud, données en mémoire
    # -ui : active l'interface web
    # -client 0.0.0.0 : accepte les connexions de n'importe où
    command: agent -dev -ui -client 0.0.0.0

    # Même réseau que les autres services
    networks:
      - lab-network

  # TODO: Ajouter le service Traefik
  traefik:
    image: traefik:v3.2
    
    ports:
      - "80:80"       # Trafic HTTP entrant
      - "8081:8080"   # Dashboard Traefik
    
    command:
      # Active le dashboard (ne pas faire en prod sans auth !)
      - --api.insecure=true
      # Logs pour debug
      - --log.level=DEBUG
      # Provider Consul Catalog : découvre les services depuis Consul
      - --providers.consulcatalog.endpoint.address=consul:8500
      # Expose seulement les services tagués explicitement
      - --providers.consulcatalog.exposedByDefault=false
      # Entrypoint HTTP
      - --entrypoints.web.address=:80
      # ============================================
      # MÉTRIQUES PROMETHEUS
      # ============================================
      # Active l'endpoint /metrics pour Prometheus
      - --metrics.prometheus=true
      # Ajoute des métriques par entrypoint (web, etc.)
      - --metrics.prometheus.entryPoint=metrics
      # Ajoute un entrypoint dédié aux métriques (port 8082)
      - --entrypoints.metrics.address=:8082

    depends_on:
      - consul
    
    networks:
      - lab-network

  # ============================================
  # PROMETHEUS - Collecte des métriques
  # ============================================
  prometheus:
    image: prom/prometheus:latest
    
    ports:
      - "9090:9090"   # Interface web Prometheus
    
    volumes:
      # Configuration Prometheus
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      # Permet le rechargement de config via API
      - '--web.enable-lifecycle'
    
    depends_on:
      - traefik
    
    networks:
      - lab-network

  # ============================================
  # GRAFANA - Visualisation des métriques
  # ============================================
  grafana:
    image: grafana/grafana:latest
    
    ports:
      - "3000:3000"   # Interface web Grafana
    
    environment:
      # Désactive le login pour le lab (pas en prod !)
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      # Désactive les analytics
      - GF_ANALYTICS_REPORTING_ENABLED=false
    
    volumes:
      # Provisionning automatique des datasources
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      # Dashboards pré-configurés
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    
    depends_on:
      - prometheus
      - loki
    
    networks:
      - lab-network

  # ============================================
  # LOKI - Agrégation des logs (comme Prometheus pour les logs)
  # ============================================
  loki:
    image: grafana/loki:latest
    
    ports:
      - "3100:3100"   # API Loki
    
    command: -config.file=/etc/loki/local-config.yaml
    
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
    
    networks:
      - lab-network

  # ============================================
  # PROMTAIL - Collecteur de logs (envoie les logs à Loki)
  # ============================================
  promtail:
    image: grafana/promtail:latest
    
    volumes:
      # Config Promtail
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      # Accès aux logs Docker
      - /var/run/docker.sock:/var/run/docker.sock:ro
    
    command: -config.file=/etc/promtail/config.yml
    
    depends_on:
      - loki
    
    networks:
      - lab-network

# TODO: Déclarer le réseau custom
networks:
  lab-network:
    driver: bridge
  
